# The synced files (lib/spec.json, lib/roles.json, public/llms*.txt) are committed,
# so CI must NOT run `sync:all` — that copies from a sibling ../core repo which
# only exists in the monorepo, not in Netlify's single-repo checkout.
# On Netlify, Nitro auto-detects the `netlify` preset and writes the static
# site to `dist/` (+ server functions to `.netlify/`), so publish = "dist".
[build]
  # nuxt build (no sync — see below), then notify IndexNow. The ping script
  # no-ops unless CONTEXT=production, so deploy previews / branch deploys
  # never announce their throwaway URLs, and it never fails the build.
  command = "npm run build:ci && node scripts/ping-indexnow.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
