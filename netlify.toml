# The synced files (lib/spec.json, lib/roles.json, public/llms*.txt) are committed,
# so CI must NOT run `sync:all` — that copies from a sibling ../core repo which
# only exists in the monorepo, not in Netlify's single-repo checkout.
# On Netlify, Nitro auto-detects the `netlify` preset and writes the static
# site to `dist/` (+ server functions to `.netlify/`), so publish = "dist".
[build]
  # nuxt build (no sync — see below), then notify IndexNow. The ping script
  # no-ops unless CONTEXT=production, so deploy previews / branch deploys
  # never announce their throwaway URLs, and it never fails the build.
  command = "npm run build:ci && node scripts/ping-indexnow.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# "View raw" → the extension-less /examples/<slug>/raw file. Serve it as UTF-8
# text so the .gui source displays in-browser (GitHub-style) instead of
# downloading, since Netlify would otherwise default to octet-stream.
[[headers]]
  for = "/examples/*/raw"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# "Download .gui" → the extension-less /examples/<slug>/download file (the .gui
# bundle). Force a download so a direct visit saves the file rather than
# rendering garbage; the anchor's download attribute supplies the real name.
[[headers]]
  for = "/examples/*/download"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Disposition = "attachment"
